[build-system]
requires = ["setuptools>=61"]  # PEP 621 support. Installing is optional: `python -m agentgov` runs from a checkout.
build-backend = "setuptools.build_meta"

[project]
name = "agent-governance-control-plane"
version = "0.1.0"
description = "Deterministic control plane for AI-agent tasks: state machine, policy-based risk classification, evidence gates, fingerprint-bound human approval, path-confined simulated execution and a hash-chained audit log."
readme = "README.md"
requires-python = ">=3.11"
# Runtime and tests use the Python standard library only.
dependencies = []

[project.scripts]
agentgov = "agentgov.cli:main"

[tool.setuptools]
packages = ["agentgov"]

[tool.setuptools.package-data]
agentgov = ["data/*.json", "schemas/*.json", "scenarios/*.json"]
